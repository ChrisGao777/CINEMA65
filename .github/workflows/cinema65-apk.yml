name: CINEMA65 v0.9.5 Auto Audit Lab
on:
  push:
    branches: [cinema65-v096-tone-guard-experiment]
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (portable bootstrap)
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          mkdir -p "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          TOOL="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [[ -z "$TOOL" ]]; then
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            cp -a /tmp/cmdtools/cmdline-tools/. "$SDK_ROOT/cmdline-tools/latest/"
            TOOL="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "$(dirname "$TOOL")" >> "$GITHUB_PATH"
          yes | "$TOOL" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$TOOL" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Pure Java fusion and ranking regression
        run: |
          set -e
          mkdir -p desktop/out
          javac -encoding UTF-8 -d desktop/out app/src/main/java/com/cinema65/oneclick/{SpatialFusion,FilmCore,ToneSafety,ExposureAllocator,EnvironmentSculptor,StrategyDirector,ColorDensityBudget,ModelRiskAuditor,CandidateRanker,GenericSubjectGate,DirectorCuts,ExportMemoryPolicy}.java desktop/*.java
          for test in DirectorCutsRegressionTest DirectorClippingSafetyRegressionTest GenericProposalAuditRegressionTest DirectorIntegrationRegressionTest StrategyDirectorRegressionTest ColorDensityRegressionTest HighResMaskGateRegressionTest EnvironmentSculptRegressionTest ToneSafetyRegressionTest CoreRegressionTest AttentionRegressionTest CandidateRegressionTest SpatialFusionRegressionTest CandidateRankerRegressionTest LightHypothesisRegressionTest EdgeSafetyRegressionTest SkyLeakRegressionTest GenericSubjectGateRegressionTest ExposureAllocatorRegressionTest ModelRiskRegressionTest StabilityRegressionTest; do
            java -cp desktop/out "$test"
          done
      - name: Download and verify U2NETP generic salient object model (research only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/model_cache research/reports
          curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 240 \
            https://huggingface.co/edgetools/u2netp/resolve/25dee37ab19c5b6ad64ba6578eba63f1ae07720c/u2netp.onnx \
            -o research/model_cache/u2netp.onnx
          echo '309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8  research/model_cache/u2netp.onnx' | sha256sum -c -
          python3 -m pip install -q --user onnxruntime==1.30.0 numpy
          python3 research/u2netp_probe.py --model research/model_cache/u2netp.onnx --json research/reports/u2netp_smoke.json
          # Wheel for independent offline evaluation in the analysis container (Python 3.13).
          mkdir -p research/wheels
          python3 -m pip download --only-binary=:all: --no-deps \
            --python-version 313 --implementation cp --abi cp313 \
            --platform manylinux_2_27_x86_64 --dest research/wheels onnxruntime==1.30.0 || true
      - uses: actions/upload-artifact@v4
        with:
          name: CINEMA65-v0.8.5-u2netp-pinned-model-and-smoke
          path: |
            research/model_cache/u2netp.onnx
            research/wheels/*.whl
            research/reports/u2netp_smoke.json
          retention-days: 7
      - name: Bundle offline vision models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          download_model() {
            local url="$1" file="$2" minbytes="$3"
            echo "Downloading bundled model: $file"
            curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 360 "$url" -o "app/src/main/assets/$file"
            test "$(stat -c%s "app/src/main/assets/$file")" -gt "$minbytes"
            sha256sum "app/src/main/assets/$file" >> model-sha256sums.txt
          }
          download_model https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite selfie_segmenter.tflite 100000
          download_model https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task face_landmarker.task 100000
          download_model https://storage.googleapis.com/mediapipe-models/image_classifier/efficientnet_lite0/int8/latest/efficientnet_lite0.tflite efficientnet_lite0.tflite 100000
          download_model https://huggingface.co/litert-community/NIMA-LiteRT/resolve/main/nima_aesthetic_fp16.tflite nima_aesthetic_fp16.tflite 100000
          download_model https://huggingface.co/litert-community/NIMA-LiteRT/resolve/main/nima_technical_fp16.tflite nima_technical_fp16.tflite 100000
          # MiDaS v2.1 small, FP16 NHWC input, replaces incompatible mixed INT8 Depth Anything export.
          download_model https://huggingface.co/litert-community/MiDaS-small/resolve/main/midas_small_256_fp16.tflite midas_small_256_fp16.tflite 15000000
          cp research/model_cache/u2netp.onnx app/src/main/assets/u2netp.onnx
          echo '309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8  app/src/main/assets/u2netp.onnx' | sha256sum -c -
          sha256sum app/src/main/assets/u2netp.onnx >> model-sha256sums.txt
          ls -lh app/src/main/assets
      - name: Depth model runtime preflight (CPU)
        shell: bash
        run: |
          python3 -m pip install -q --user ai-edge-litert numpy
          python3 - <<'PYMODEL'
          import numpy as np
          from ai_edge_litert.interpreter import Interpreter
          p='app/src/main/assets/midas_small_256_fp16.tflite'
          m=Interpreter(model_path=p, num_threads=2)
          m.allocate_tensors()
          x=m.get_input_details()[0];y=m.get_output_details()[0]
          assert list(x['shape']) == [1,256,256,3], x['shape']
          assert list(y['shape']) == [1,256,256], y['shape']
          m.set_tensor(x['index'], np.zeros(x['shape'],dtype=np.float32))
          m.invoke()
          result=m.get_tensor(y['index'])
          assert np.isfinite(result).all(), 'nonfinite depth output'
          print('MiDaS allocate_tensors + invoke PASS, range:',float(result.min()),float(result.max()))
          PYMODEL
      - name: Assemble
        run: gradle :app:assembleDebug --no-daemon
      - name: APK signature and model asset audit
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | tee apk-inventory.txt | grep -E 'assets/(selfie_segmenter|face_landmarker|efficientnet_lite0|nima_.*|midas_small|u2netp)'
          sha256sum app/build/outputs/apk/debug/app-debug.apk > CINEMA65-v0.9.5-mask-audit.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CINEMA65-v0.9.6-tone-guard-ab-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            CINEMA65-v0.9.5-mask-audit.apk.sha256
            model-sha256sums.txt
            apk-inventory.txt
